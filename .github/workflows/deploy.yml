name: Deploiement Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Générer local.properties avec clés
        env:
          APP_NAME: ${{ secrets.SECRET_APP_NAME }}
          WEB_CLIENT_ID: ${{ secrets.SECRET_WEB_CLIENT_ID }}
          DATABASE_URL: ${{ secrets.SECRET_DATABASE_URL }}
          URL_SITE_WEB: ${{ secrets.SECRET_URL_SITE_WEB }}
        run: |
          echo "APP_NAME=\"$APP_NAME\"" >> local.properties
          echo "WEB_CLIENT_ID=\"$WEB_CLIENT_ID\"" >> local.properties
          echo "DATABASE_URL=\"$DATABASE_URL\"" >> local.properties
          echo "URL_SITE_WEB=\"$URL_SITE_WEB\"" >> local.properties

      - name: Créer le fichier google-services.json
        run: echo '${{ secrets.SECRET_GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Compiler l'APK
        run: ./gradlew assembleRelease

      - name: Installer les outils Android 29.0.3
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;29.0.3"

      - name: Signer l'APK avec une clé fixe
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Sauvegarder l'APK signé (artifact GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: app-signee-apk
          path: ${{steps.sign_app.outputs.signedReleaseFile}}

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configuration Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload APK vers GCS
        env:
          GCS_BUCKET: les-ombres-du-son-483614-mobile-releases
        run: |
          APK_FILE="${{steps.sign_app.outputs.signedReleaseFile}}"
          VERSION="v${{ github.run_number }}"

          # Upload APK versionné
          gsutil cp "$APK_FILE" "gs://${GCS_BUCKET}/releases/les-ombres-du-son-${VERSION}.apk"

          # Upload comme "latest" (pointe toujours vers le dernier build)
          gsutil cp "$APK_FILE" "gs://${GCS_BUCKET}/releases/les-ombres-du-son-latest.apk"

          # Métadonnées pour le téléchargement
          gsutil setmeta \
            -h "Content-Type:application/vnd.android.package-archive" \
            -h "Content-Disposition:attachment; filename=les-ombres-du-son-${VERSION}.apk" \
            -h "Cache-Control:public, max-age=3600" \
            "gs://${GCS_BUCKET}/releases/les-ombres-du-son-${VERSION}.apk"

          gsutil setmeta \
            -h "Content-Type:application/vnd.android.package-archive" \
            -h "Content-Disposition:attachment; filename=les-ombres-du-son.apk" \
            -h "Cache-Control:no-cache" \
            "gs://${GCS_BUCKET}/releases/les-ombres-du-son-latest.apk"

      - name: Résumé du déploiement
        env:
          GCS_BUCKET: les-ombres-du-son-483614-mobile-releases
        run: |
          VERSION="v${{ github.run_number }}"
          echo "## 🚀 Déploiement réussi" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | Lien |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK versionné** | https://storage.googleapis.com/${GCS_BUCKET}/releases/les-ombres-du-son-${VERSION}.apk |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dernier APK** | https://storage.googleapis.com/${GCS_BUCKET}/releases/les-ombres-du-son-latest.apk |" >> $GITHUB_STEP_SUMMARY